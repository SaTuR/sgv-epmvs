services:
  backend:
    volumes:
      - ./storage:/app/storage
    command: gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 2 --timeout 120
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: production
    volumes: []
    command: []
    restart: unless-stopped

  nginx:
    volumes:
      - ./nginx/conf.d/sgv-epmvs.prod.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
